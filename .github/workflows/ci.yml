name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests (coverage gate 85 %)
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with: { name: coverage, path: coverage.xml }

  test-campaign:
    # The system test campaign from spec/system_spec.yaml, against both releases.
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Release 1.3.0 (release candidate, the bench must find the seeded defects)
        run: |
          set +e
          fieldbench run --release 1.3.0 --results results
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected failing procedures on 1.3.0, pytest exit code $code"; exit 1; }
          test "$(grep -l '| Status | open |' results/issues/*.md | wc -l)" -eq 3
      - name: Release 1.4.0 (fix release, every procedure must pass)
        run: fieldbench run --release 1.4.0 --results results
      - name: Guidance check on the real NMEA track
        run: fieldbench guidance --nmea samples/nmea/ijsselmeer_bg_zeus2.nmea --plot results/plots/guidance_ijsselmeer.png
      - name: Log failures of the fix release as GitHub issues
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for report in results/issues/*.md; do
            grep -q '| Status | open |' "$report" && grep -q '| Found in release | 1.4.0 |' "$report" || continue
            title="[bench] $(head -1 "$report" | sed 's/^# //')"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
              gh issue create --title "$title" --body-file "$report"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: results }

  e2e:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[e2e]"
      - run: python -m playwright install --with-deps chromium
      - name: Start API and web console
        run: |
          FIELDBENCH_DATA=$RUNNER_TEMP/bench uvicorn fieldbench.api:app --port 8000 &
          (cd site && python -m http.server 5500) &
          timeout 30 bash -c 'until curl -sf localhost:8000/health; do sleep 1; done'
      - run: pytest e2e --browser chromium

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Container answers /health
        run: |
          docker run -d --name api -p 8000:8000 fieldbench
          timeout 60 bash -c 'until curl -sf localhost:8000/health; do sleep 2; done'
          docker rm -f api

  pages:
    # Publish the web console plus the latest CI reports to GitHub Pages.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test-campaign, e2e, docker]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: test-results, path: results }
      - name: Assemble site
        run: |
          mkdir -p _site/ci
          cp -r site/* _site/
          cp -r results/* _site/ci/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
